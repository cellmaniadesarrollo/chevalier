<div class="camera-modal">

  <div class="camera-header">
    <h3 class="mb-0">Tomar foto</h3>
    <button type="button" class="btn-close-icon" (click)="cancel()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Estado: pidiendo permiso -->
  <div class="camera-status" *ngIf="state === 'requesting'">
    <i class="bi bi-camera-fill fs-1 text-muted"></i>
    <p class="mt-2">Solicitando acceso a la cámara...</p>
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Estado: permiso denegado -->
  <div class="camera-status" *ngIf="state === 'denied'">
    <i class="bi bi-camera-video-off-fill fs-1 text-danger"></i>
    <p class="mt-2 fw-bold">Acceso a la cámara denegado</p>
    <p class="text-muted small">
      Para tomar una foto, permití el acceso a la cámara desde la configuración del navegador
      y volvé a intentar.
    </p>
    <button mat-stroked-button color="primary" (click)="startCamera()">
      <i class="bi bi-arrow-repeat me-1"></i> Reintentar
    </button>
  </div>

  <!-- Estado: error genérico (sin cámara, etc) -->
  <div class="camera-status" *ngIf="state === 'error'">
    <i class="bi bi-exclamation-triangle-fill fs-1 text-warning"></i>
    <p class="mt-2">{{ errorMessage }}</p>
    <button mat-stroked-button color="primary" (click)="startCamera()">
      <i class="bi bi-arrow-repeat me-1"></i> Reintentar
    </button>
  </div>

  <!-- Estado: cámara en vivo -->
  <div class="camera-live" *ngIf="state === 'live' || state === 'requesting'" [hidden]="state !== 'live'">
    <video #videoElement autoplay playsinline muted class="camera-video"></video>

    <div class="camera-controls">
      <button type="button" class="btn-switch" (click)="switchCamera()" title="Cambiar cámara">
        <i class="bi bi-arrow-repeat"></i>
      </button>

      <button type="button" class="btn-capture" (click)="capturePhoto()" title="Tomar foto">
        <span class="capture-inner"></span>
      </button>

      <div class="btn-switch-placeholder"></div>
    </div>
  </div>

  <!-- Estado: preview de la foto tomada -->
  <div class="camera-preview" *ngIf="state === 'preview'">
    <img [src]="capturedPhotoUrl" alt="Foto capturada" class="captured-image" />

    <div class="preview-controls">
      <button type="button" mat-stroked-button (click)="retake()">
        <i class="bi bi-arrow-counterclockwise me-1"></i> Volver a tomar
      </button>
      <button type="button" mat-raised-button color="primary" (click)="confirm()">
        <i class="bi bi-check-lg me-1"></i> Usar esta foto
      </button>
    </div>
  </div>

  <!-- canvas oculto usado para capturar el frame -->
  <canvas #canvasElement style="display: none;"></canvas>

</div>
