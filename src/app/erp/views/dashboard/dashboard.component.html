<div class="admin-dashboard-layout">

  <app-admin-dashboard *ngIf="isAdminOrSupervisor()"></app-admin-dashboard>

  <app-cashier-dashboard *ngIf="isCashierOrAdmin()"></app-cashier-dashboard>

  <app-barber-dashboard *ngIf="isHairdresser()"></app-barber-dashboard>

  <div class="alert alert-warning m-3" role="alert" *ngIf="!hasAnyDashboardAccess()">
    <i class="bi bi-exclamation-triangle me-2"></i>
    No tienes permisos suficientes para visualizar el panel de control.
  </div>

</div>
